<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypergraph Visualization</title>
    <script src="https://unpkg.com/@antv/g6@5.0.49/dist/g6.min.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- 超图浏览器（左栏实体列表、画布、右栏子图统计与渲染设置），与 HypergraphViewer、Hyper-RAG web-ui 共用 hypergraph-viz -->
    <script src="https://unpkg.com/hypergraph-viz@0.2.0/dist/hypergraph-viz.explorer.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/hypergraph-viz@0.2.0/dist/style.css" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { mountExplorer, fromKeyedEdges } = window.HypergraphViz;

      const getJSON = async (path, params) => {
        const res = await fetch(`${path}?${new URLSearchParams(params)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        return data;
      };

      mountExplorer(document.getElementById("root"), {
        // 数据源：接查看器服务的 /api/database/info、/api/vertices、/api/graph。
        // 全库可能很大，左栏只显示数据库计数与实体列表（不统计全库、没有超边列表），任何实体都可作为中心
        source: {
          overview: async () => ({ database: await getJSON("/api/database/info") }),
          listVertices: ({ page, pageSize, search, sortBy, sortOrder }) =>
            getJSON("/api/vertices", { page, page_size: pageSize, search, sort_by: sortBy, sort_order: sortOrder }),
          // 超边 key 为用 |#| 拼接的成员，转为 hypergraph-viz 的输入格式
          subgraph: async (vertexId) => fromKeyedEdges(await getJSON("/api/graph", { vertex_id: vertexId })),
        },
        // ?vertex=<id>（如从管理后台跳转）指定默认中心，否则为实体列表中的第一个
        defaultCenter: new URLSearchParams(window.location.search).get("vertex") || undefined,
        title: "Hypergraph-DB",
        // 实体列表中的数字是实体所在的超边数
        messages: { en: { neighborhoodCol: "Degree" }, zh: { neighborhoodCol: "度数" } },
        storageKey: "hgdb-viewer",
        // 语言与管理后台（admin.html）共用同一个 localStorage 键
        localeStorageKey: "hgdb-admin-lang",
      });
    </script>
  </body>
</html>
