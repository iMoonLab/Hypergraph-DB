<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypergraph Visualization</title>
    <!-- npm 版 G6，超边轮廓交互由下方 HoverBubbleSets 插件补齐 -->
    <script src="https://unpkg.com/@antv/g6@5.0.49/dist/g6.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- <script src="./data.js"></script> -->
    <style type="text/tailwindcss">
      @theme {
        --color-primary-50: #faf5ff;
        --color-primary-500: #8b5cf6;
        --color-primary-600: #7c3aed;
        --color-primary-700: #6d28d9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useLayoutEffect, useMemo, useRef } = React;
      const { Graph, BubbleSets, CommonEvent, ExtensionCategory, GraphEvent, register } = window.G6;

      // ------------------------------------------------------------------ hover-bubble-sets
      // 可交互的 bubble-sets 插件（与 HypergraphViewer、Hyper-RAG web-ui 同一实现），在原版 BubbleSets 上补齐：
      // - 超边轮廓接收鼠标事件，在 graph 上派发 pointerover / pointermove / pointerleave / click，
      //   事件的 targetType 为 'bubble-sets'，target 为该插件的 options（含 key、members 与调用方附加的数据）；
      // - 布局进行中隐藏轮廓，布局结束后按节点新位置重画；
      // - 首次渲染完成前被销毁时不再因 shape 为空而抛异常；
      // - 配置更新（graph.setPlugins，如点击高亮改透明度）后立即应用到已画好的轮廓，原版 update 只合并配置、不重画。
      const HOVER_BUBBLE_SETS = "hover-bubble-sets";
      const BUBBLE_SETS_TARGET = "bubble-sets";
      const SHAPE_EVENTS = [
        CommonEvent.POINTER_OVER,
        CommonEvent.POINTER_MOVE,
        CommonEvent.POINTER_LEAVE,
        CommonEvent.CLICK,
      ];

      class HoverBubbleSets extends BubbleSets {
        constructor(context, options) {
          super(context, { zIndex: -1, pointerEvents: "all", ...options });
          this.layouting = false;
          this.boundKey = null;
          this.onBeforeLayout = () => {
            this.layouting = true;
            this.setContourVisible(false);
          };
          this.onAfterLayout = () => {
            this.layouting = false;
            this.drawBubbleSets();
          };
          this.forward = (event) => {
            this.context.graph.emit(event.type, {
              ...event,
              target: { ...this.options, id: this.options.key, options: this.options },
              targetType: BUBBLE_SETS_TARGET,
              originalTarget: event.target,
            });
          };
          const { graph } = this.context;
          // 基类构造时已把原始 drawBubbleSets 绑定到 AFTER_RENDER，换成带事件绑定的版本
          graph.off(GraphEvent.AFTER_RENDER, this.drawBubbleSets);
          const baseDraw = this.drawBubbleSets;
          this.drawBubbleSets = () => {
            // 成员不变时基类会复用缓存路径；布局移动了节点，必须重算
            this.init();
            baseDraw();
            this.bindShapeEvents();
            this.setContourVisible(!this.layouting);
          };
          graph.on(GraphEvent.AFTER_RENDER, this.drawBubbleSets);
          graph.on(GraphEvent.BEFORE_LAYOUT, this.onBeforeLayout);
          graph.on(GraphEvent.AFTER_LAYOUT, this.onAfterLayout);
        }

        update(options) {
          super.update(options);
          // 只更新样式（路径 d 不在 style 中，保持不变），不重算轮廓
          if (this.shape && !this.shape.destroyed) this.shape.update(this.parseOptions().style);
        }

        setContourVisible(visible) {
          if (this.shape) this.shape.style.visibility = visible ? "visible" : "hidden";
        }

        bindShapeEvents() {
          const key = this.shape?.shapeMap?.key;
          if (!key || key === this.boundKey) return;
          this.unbindShapeEvents();
          key.style.pointerEvents = "all";
          SHAPE_EVENTS.forEach((type) => key.addEventListener(type, this.forward));
          this.boundKey = key;
        }

        unbindShapeEvents() {
          if (!this.boundKey) return;
          SHAPE_EVENTS.forEach((type) => this.boundKey.removeEventListener(type, this.forward));
          this.boundKey = null;
        }

        destroy() {
          const { graph } = this.context;
          graph.off(GraphEvent.AFTER_RENDER, this.drawBubbleSets);
          graph.off(GraphEvent.BEFORE_LAYOUT, this.onBeforeLayout);
          graph.off(GraphEvent.AFTER_LAYOUT, this.onAfterLayout);
          this.unbindShapeEvents();
          if (!this.shape) this.shape = { destroy: () => undefined };
          super.destroy();
        }
      }

      register(ExtensionCategory.PLUGIN, HOVER_BUBBLE_SETS, HoverBubbleSets);

      // 首次渲染完成前销毁（换数据）时，G6 在销毁元素层时抛异常；此时插件、交互、布局已销毁，补上画布销毁即可
      const destroyGraph = (graph) => {
        if (graph.destroyed) return;
        try {
          graph.destroy();
        } catch (e) {
          graph.context.canvas?.destroy();
          graph.destroyed = true;
        }
      };

      // API base path
      const API_BASE = window.location.origin;
      // dev mode
      // const API_BASE = "http://localhost:8080";

      // Configuration constants
      const COLORS = [
        "#F6BD16",
        "#00C9C9",
        "#F08F56",
        "#D580FF",
        "#FF3D00",
        "#16f69c",
        "#004ac9",
        "#f056d1",
        "#a680ff",
        "#c8ff00",
      ];

      // 6 predefined colors, cycled for different entity types
      const ENTITY_TYPE_COLORS_PALETTE = [
        "#00C9C9",
        "#a68fff",
        "#F08F56",
        "#0d7c4f",
        "#004ac9",
        "#f056d1",
      ];

      const DEFAULT_NODE_COLOR = "#8b5cf6";

      // Dynamically generate entity type color mapping
      const generateEntityTypeColors = (vertices) => {
        const entityTypes = [
          ...new Set(vertices.map((v) => v.entity_type).filter(Boolean)),
        ];
        const colorMap = {};

        entityTypes.forEach((entityType, index) => {
          colorMap[entityType] =
            ENTITY_TYPE_COLORS_PALETTE[
              index % ENTITY_TYPE_COLORS_PALETTE.length
            ];
        });

        return colorMap;
      };
      const LAYOUT_THRESHOLD = 100;
      const EDGE_SEPARATOR = "|#|";

      // 超边轮廓的透明度与线宽：常态 / 点击选中 / 其他超边被选中时变淡
      const BUBBLE_NORMAL = { fillOpacity: 0.2, strokeOpacity: 0.2, lineWidth: 1 };
      const BUBBLE_HIGHLIGHT = { fillOpacity: 0.45, strokeOpacity: 1, lineWidth: 3 };
      const BUBBLE_DIMMED = { fillOpacity: 0.03, strokeOpacity: 0.05, lineWidth: 1 };

      // Utility functions
      const createBubbleStyle = (baseColor) => ({
        fill: baseColor,
        stroke: baseColor,
        ...BUBBLE_NORMAL,
        maxRoutingIterations: 100,
        maxMarchingIterations: 20,
        pixelGroup: 4,
        edgeR0: 10,
        edgeR1: 60,
        nodeR0: 1,
        nodeR1: 5,
        morphBuffer: 10,
        threshold: 4,
        memberInfluenceFactor: 1,
        edgeInfluenceFactor: 4,
        nonMemberInfluenceFactor: -0.8,
        virtualEdges: true,
      });

      const getNodeColor = (node, selectedVertex, entityTypeColors) => {
        if (node.id === selectedVertex) return "#6d28d9";
        return entityTypeColors[node.entity_type] || DEFAULT_NODE_COLOR;
      };

      const formatDescription = (description) => {
        if (!description) return "";
        return description.split("<SEP>").join(" ");
      };

      // API call functions
      const fetchDatabaseInfo = async () => {
        if (typeof datas !== "undefined") {
          return Promise.resolve(datas.database);
        }
        const response = await fetch(`${API_BASE}/api/database/info`);
        return await response.json();
      };

      const fetchVertices = async (
        page,
        pageSize,
        search,
        sortBy,
        sortOrder
      ) => {
        if (typeof datas !== "undefined") {
          const toLower = (v) => (v ?? "").toString().toLowerCase();
          let list = Array.isArray(datas.vertices) ? datas.vertices : [];

          if (search) {
            const q = toLower(search);
            list = list.filter(
              (v) =>
                toLower(v.id).includes(q) ||
                toLower(v.entity_type).includes(q) ||
                toLower(v.description).includes(q)
            );
          }

          if (sortBy === "degree") {
            list.sort((a, b) =>
              sortOrder === "asc"
                ? (a.degree || 0) - (b.degree || 0)
                : (b.degree || 0) - (a.degree || 0)
            );
          } else if (sortBy === "id") {
            list.sort((a, b) => {
              const cmp = String(a.id).localeCompare(String(b.id));
              return sortOrder === "asc" ? cmp : -cmp;
            });
          }

          const total = list.length;
          const total_pages = Math.max(1, Math.ceil(total / pageSize));
          const cur = Math.min(Math.max(1, page), total_pages);
          const start = (cur - 1) * pageSize;
          const data = list.slice(start, start + pageSize);
          return Promise.resolve({
            data,
            pagination: { page: cur, page_size: pageSize, total, total_pages },
          });
        }
        const params = new URLSearchParams({
          page: page.toString(),
          page_size: pageSize.toString(),
          search: search || "",
          sort_by: sortBy,
          sort_order: sortOrder,
        });
        const response = await fetch(`${API_BASE}/api/vertices?${params}`);
        return await response.json();
      };

      const fetchGraphData = async (vertexId) => {
        if (typeof datas !== "undefined") {
          const entry = datas.graphs[vertexId];
          if (entry && entry.vertices && entry.edges) {
            return Promise.resolve({
              vertices: entry.vertices,
              edges: entry.edges,
            });
          }
          return Promise.resolve({ vertices: {}, edges: {} });
        }
        const params = new URLSearchParams({ vertex_id: vertexId });
        const response = await fetch(`${API_BASE}/api/graph?${params}`);
        return await response.json();
      };

      // ------------------------------------------------------------------ i18n
      // 与管理后台（admin.html）同一套做法，语言选择也共用同一个 localStorage 键
      const MESSAGES = {
        en: {
          pageTitle: "Hypergraph Visualization",
          databaseInfo: "Database Information",
          verticesLabel: "Vertices:", hyperedgesLabel: "Hyperedges:", edgesLabel: "Edges:",
          searchList: "Search & Vertex List",
          searchPlaceholder: "Search vertex ID, type or description...",
          found: "Found {n} results", loadingVertices: "Loading vertices...", noMatch: "No matching vertices found",
          typeLabel: "Type:", idLabel: "ID:", degreeLabel: "Degree:",
          prev: "Previous", next: "Next",
          titleHyper: "Hypergraph Visualization", titleGraph: "Graph Visualization",
          modeLabel: "Mode:", modeHyper: "Hypergraph", modeGraph: "Graph",
          loadingGraph: "Loading hypergraph data...", loadingHint: "This may take a few seconds",
          loadFailed: "Failed to load graph data",
          detail: "Hypergraph Detail", hyperedge: "Hyperedge", edge: "Edge", node: "Node",
        },
        zh: {
          pageTitle: "超图可视化",
          databaseInfo: "数据库信息",
          verticesLabel: "实体：", hyperedgesLabel: "超边：", edgesLabel: "边：",
          searchList: "搜索与实体列表",
          searchPlaceholder: "搜索实体 ID、类型或描述...",
          found: "共找到 {n} 个结果", loadingVertices: "加载实体中...", noMatch: "没有匹配的实体",
          typeLabel: "类型：", idLabel: "ID：", degreeLabel: "度数：",
          prev: "上一页", next: "下一页",
          titleHyper: "超图可视化", titleGraph: "图可视化",
          modeLabel: "模式：", modeHyper: "超图", modeGraph: "图",
          loadingGraph: "加载超图数据中...", loadingHint: "可能需要几秒钟",
          loadFailed: "加载图数据失败",
          detail: "超图详情", hyperedge: "超边", edge: "边", node: "实体",
        },
      };
      const LANG_KEY = "hgdb-admin-lang";

      const detectLang = () => {
        try {
          const saved = localStorage.getItem(LANG_KEY);
          if (saved in MESSAGES) return saved;
        } catch (e) {}
        return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
      };
      // Set by <HypergraphViewer> on every render, before its children render.
      let currentLang = "en";
      function t(key, vars = {}) {
        // 未收录的键原样返回（如服务端返回的错误信息）
        const msg = MESSAGES[currentLang][key] ?? MESSAGES.en[key] ?? key;
        return msg.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
      }

      const EXCLUDED_KEYS = new Set([
        "id",
        "label",
        "style",
        "data",
        "weight",
        "source_id",
        "cluster",
      ]);

      // 悬停卡片中超边优先显示的属性、有 type 时不显示的属性（类型看 type），以及最多显示的属性个数；侧边栏显示全部属性
      const HYPEREDGE_PRIORITY = ["description", "type", "summary", "keywords", "members"];
      const HYPEREDGE_TIP_EXCLUDED = ["keywords"];
      const HYPEREDGE_FIELD_LIMIT = 5;
      const TIP_OFFSET = 12;
      const TIP_MARGIN = 8;

      const PropertyRow = ({ name, value }) => {
        // Special handling for keywords
        if (name === "keywords" && typeof value === "string") {
          return (
            <div>
              <span className="font-medium">keywords:</span>
              <div className="flex flex-wrap gap-2 mt-2">
                {value
                  .split(/,|，|、|。|<SEP>/)
                  .filter((k) => k.trim())
                  .map((keyword, i) => (
                    <span
                      key={i}
                      className="inline-block p-1 bg-primary-50 rounded text-xs"
                    >
                      {keyword.trim()}
                    </span>
                  ))}
              </div>
            </div>
          );
        }

        // Special handling for members
        if (Array.isArray(value)) {
          return (
            <div>
              <div className="font-medium">
                {name} ({value.length}):
              </div>
              <div className="flex flex-wrap gap-2 mt-2">
                {value.map((member, i) => (
                  <span key={i} className="p-1 bg-primary-50 rounded text-xs">
                    {member}
                  </span>
                ))}
              </div>
            </div>
          );
        }

        // Convert value to string for length check
        const stringValue =
          typeof value === "object"
            ? JSON.stringify(value, null, 2)
            : String(value).replace(/<SEP>/g, " | ");

        // Short values are displayed as tags
        if (stringValue.length < 20) {
          return (
            <div>
              <span className="font-medium">{name}:</span>
              <div className="mt-1">
                <span className="inline-block px-2 py-1 bg-gray-100 rounded text-xs">
                  {stringValue}
                </span>
              </div>
            </div>
          );
        }

        // Default handling for longer values
        return (
          <div>
            <span className="font-medium">{name}:</span>
            <div className="mt-1 text-gray-600 bg-gray-100 p-2 rounded text-xs">
              {stringValue}
            </div>
          </div>
        );
      };

      // 按属性自动渲染超边 / 顶点；侧边栏与悬停卡片（HoverTip）共用。
      // priority 中的字段排在最前（默认 description），其余按原顺序；exclude 额外不显示的属性；limit 限制显示的属性个数
      const PropertyList = ({
        item,
        priority = ["description"],
        exclude = [],
        limit = Infinity,
      }) => {
        const rank = (k) =>
          priority.includes(k) ? priority.indexOf(k) : priority.length;
        return Object.entries(item)
          .filter(
            ([key, value]) =>
              value &&
              !(Array.isArray(value) && value.length === 0) &&
              !EXCLUDED_KEYS.has(key) &&
              !exclude.includes(key)
          )
          .sort(([a], [b]) => rank(a) - rank(b))
          .slice(0, limit)
          .map(([key, value]) => (
            <PropertyRow key={key} name={key} value={value} />
          ));
      };

      // 跟随鼠标的悬停卡片，替代 G6 tooltip 插件：插件把视口坐标与画布尺寸比较来翻转，
      // 且卡片插在画布容器内，图边缘的卡片会被裁掉。这里挂到 body，默认在指针右下，
      // 越出视口的一侧翻到指针另一侧，最后夹紧在视口内
      const HoverTip = ({ title, item, priority, exclude, limit, x, y }) => {
        const ref = useRef(null);
        const [pos, setPos] = useState({
          left: x + TIP_OFFSET,
          top: y + TIP_OFFSET,
        });

        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const { offsetWidth: w, offsetHeight: h } = el;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          let left = x + TIP_OFFSET;
          let top = y + TIP_OFFSET;
          if (left + w > vw - TIP_MARGIN) left = x - TIP_OFFSET - w;
          if (top + h > vh - TIP_MARGIN) top = y - TIP_OFFSET - h;
          left = Math.max(TIP_MARGIN, Math.min(left, vw - w - TIP_MARGIN));
          top = Math.max(TIP_MARGIN, Math.min(top, vh - h - TIP_MARGIN));
          setPos((prev) =>
            prev.left === left && prev.top === top ? prev : { left, top }
          );
        }, [item, x, y]);

        return ReactDOM.createPortal(
          <div
            ref={ref}
            className="fixed z-[2000] w-80 overflow-hidden pointer-events-none break-words bg-white/95 border border-gray-200 rounded-md shadow-lg p-3"
            style={{
              left: pos.left,
              top: pos.top,
              maxHeight: `calc(100vh - ${TIP_MARGIN * 2}px)`,
            }}
          >
            <div className="text-sm text-gray-700 space-y-3">
              <div className="text-base font-semibold text-gray-900 pb-1 border-b-2 border-primary-500">
                {t(title)}
              </div>
              <PropertyList
                item={item}
                priority={priority}
                exclude={exclude}
                limit={limit}
              />
            </div>
          </div>,
          document.body
        );
      };

      // 悬停目标 → 悬停卡片内容：顶点 → 顶点属性；连线（2 个顶点的超边）/ 超边轮廓 → 超边属性
      const tipOf = (e, data) => {
        if (e.targetType === "node") {
          const node = data?.data.nodes.find((n) => n.id === e.target.id);
          return node && { title: "node", item: node };
        }
        // 只有 2 个成员的超边显示为“边”
        const hyperedge = (item) => ({
          title: item.members.length === 2 ? "edge" : "hyperedge",
          item,
          priority: HYPEREDGE_PRIORITY,
          // 没有 type 的超边（如 Hyper-RAG 原版抽取的图）仍显示 keywords
          exclude: item.type ? HYPEREDGE_TIP_EXCLUDED : [],
          limit: HYPEREDGE_FIELD_LIMIT,
        });
        if (e.targetType === "edge") {
          const edge = data?.data.edges.find((d) => d.id === e.target.id);
          if (!edge) return null;
          const { source, target, ...rest } = edge;
          return hyperedge({ ...rest, members: [source, target] });
        }
        if (e.targetType === BUBBLE_SETS_TARGET) {
          const { edge = {}, members } = e.target.options || {};
          return hyperedge({
            ...edge,
            members: Array.isArray(members) ? members : [],
          });
        }
        return null;
      };

      // 点击选中的超边（轮廓或连线）→ { key, members, item }；null 表示未选中
      const selectionOf = (e, data) => {
        if (e.targetType === BUBBLE_SETS_TARGET) {
          const { key, edge = {}, members } = e.target.options || {};
          const list = Array.isArray(members) ? members : [];
          return { key, members: list, item: { ...edge, members: list } };
        }
        if (e.targetType === "edge") {
          const edge = data?.data.edges.find((d) => d.id === e.target.id);
          if (!edge) return null;
          const { source, target, ...rest } = edge;
          return {
            key: edge.id,
            members: [source, target],
            item: { ...rest, members: [source, target] },
          };
        }
        return null;
      };

      // 高亮选中的超边及其成员实体，其余实体、连线、超边轮廓变淡；selection 为 null 时全部恢复
      const applySelection = (graph, data, selection) => {
        const members = new Set(selection?.members || []);
        const states = {};
        data.data.nodes.forEach((n) => {
          states[n.id] = !selection ? [] : members.has(n.id) ? ["highlight"] : ["inactive"];
        });
        data.data.edges.forEach((d) => {
          states[d.id] = !selection ? [] : d.id === selection.key ? ["highlight"] : ["inactive"];
        });
        graph.setElementState(states, false);
        graph.setPlugins((plugins) =>
          plugins.map((p) =>
            p.type !== HOVER_BUBBLE_SETS
              ? p
              : {
                  ...p,
                  ...(!selection
                    ? BUBBLE_NORMAL
                    : p.key === selection.key
                    ? BUBBLE_HIGHLIGHT
                    : BUBBLE_DIMMED),
                }
          )
        );
      };

      function HypergraphViewer() {
        const containerRef = useRef(null);
        const graphRef = useRef(null);
        const searchTimeoutRef = useRef(null);

        const [databaseInfo, setDatabaseInfo] = useState({
          vertices: 0,
          edges: 0,
        });
        const [vertices, setVertices] = useState([]);
        const [pagination, setPagination] = useState({
          page: 1,
          page_size: 50,
          total: 0,
          total_pages: 0,
        });
        const [selectedVertex, setSelectedVertex] = useState("");
        // Vertex requested via ?vertex=<id> (e.g. from the admin console); wins over the
        // default "select first vertex" until the user picks something else.
        const initialVertexRef = useRef(
          new URLSearchParams(window.location.search).get("vertex") || ""
        );
        const [graphData, setGraphData] = useState(null);
        const [loading, setLoading] = useState(false);
        const [loadingVertices, setLoadingVertices] = useState(false);
        const [error, setError] = useState("");
        const [searchTerm, setSearchTerm] = useState("");
        const [sortBy, setSortBy] = useState("degree");
        const [sortOrder, setSortOrder] = useState("desc");
        const [visualizationMode, setVisualizationMode] = useState("hyper");
        const [hoverHyperedge, setHoverHyperedge] = useState(null);
        const [hoverNode, setHoverNode] = useState(null);
        const [tip, setTip] = useState(null);
        // 选中期间侧边栏固定显示该超边，不随悬停变化
        const selectedRef = useRef(null);
        const [lang, setLang] = useState(detectLang);
        currentLang = lang;
        useEffect(() => {
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          document.title = t("pageTitle");
          try {
            localStorage.setItem(LANG_KEY, lang);
          } catch (e) {}
        }, [lang]);

        // Generate entity type color mapping
        const entityTypeColors = useMemo(() => {
          return generateEntityTypeColors(vertices);
        }, [vertices]);

        // Load database info
        useEffect(() => {
          fetchDatabaseInfo().then(setDatabaseInfo).catch(console.error);
        }, []);

        // Load vertices list
        const loadVertices = async (page, search, sortBy, sortOrder) => {
          setLoadingVertices(true);
          try {
            const result = await fetchVertices(
              page,
              pagination.page_size,
              search,
              sortBy,
              sortOrder
            );
            setVertices(result.data);
            setPagination(result.pagination);

            // Select the requested vertex, otherwise the first one
            if (initialVertexRef.current) {
              setSelectedVertex(initialVertexRef.current);
            } else if (result.data.length > 0) {
              setSelectedVertex(result.data[0].id);
            }
          } catch (err) {
            console.error("Failed to load vertices:", err);
          } finally {
            setLoadingVertices(false);
          }
        };

        // Initial load of vertices
        useEffect(() => {
          loadVertices(1, "", sortBy, sortOrder);
        }, []);

        // Search debounce
        useEffect(() => {
          if (searchTimeoutRef.current) {
            clearTimeout(searchTimeoutRef.current);
          }

          searchTimeoutRef.current = setTimeout(() => {
            loadVertices(1, searchTerm, sortBy, sortOrder);
          }, 300);

          return () => {
            if (searchTimeoutRef.current) {
              clearTimeout(searchTimeoutRef.current);
            }
          };
        }, [searchTerm]);

        // Reload when sort changes
        useEffect(() => {
          if (vertices.length > 0) {
            loadVertices(pagination.page, searchTerm, sortBy, sortOrder);
          }
        }, [sortBy, sortOrder]);

        // Load when page changes
        const handlePageChange = (newPage) => {
          initialVertexRef.current = "";
          loadVertices(newPage, searchTerm, sortBy, sortOrder);
        };

        // Load graph data
        useEffect(() => {
          if (selectedVertex) {
            setLoading(true);
            setError("");

            fetchGraphData(selectedVertex)
              .then((data) => {
                if (data.error) {
                  setError(data.error);
                } else {
                  setGraphData(data);
                }
              })
              .catch((err) => {
                // 存翻译键，显示时翻译
                setError("loadFailed");
                console.error(err);
              })
              .finally(() => {
                setLoading(false);
              });
          }
        }, [selectedVertex]);

        // Convert data to G6 Graph format
        const graphDataFormatted = useMemo(() => {
          if (!graphData) return null;

          const hyperData = {
            nodes: Object.entries(graphData.vertices).map(([key, value]) => ({
              id: key,
              label: key,
              ...value,
            })),
            edges: [],
            hyperEdges: [],
          };
          const plugins = [];
          const edgeEntries = Object.entries(graphData.edges);

          if (visualizationMode === "graph") {
            // Graph mode: only show dimension 2 ball-and-stick diagram
            const edgeSet = new Set();

            edgeEntries.forEach(([key, edge]) => {
              const nodes = key.split(EDGE_SEPARATOR);
              if (nodes.length !== 2) return;

              const [a, b] = nodes;
              const edgeId = a < b ? `${a}-${b}` : `${b}-${a}`;

              if (!edgeSet.has(edgeId)) {
                edgeSet.add(edgeId);
                hyperData.edges.push({
                  id: edgeId,
                  source: a,
                  target: b,
                  ...edge,
                });
              }
            });

            // Filter unconnected nodes
            const connectedNodes = new Set();
            hyperData.edges.forEach((edge) => {
              connectedNodes.add(edge.source);
              connectedNodes.add(edge.target);
            });
            hyperData.nodes = hyperData.nodes.filter((node) =>
              connectedNodes.has(node.id)
            );
          } else {
            // Hyper mode: render 2-node entries as normal edges, others as bubble-sets
            const edgeSet = new Set();
            edgeEntries.forEach(([key, edge], i) => {
              const nodes = key.split(EDGE_SEPARATOR);

              if (nodes.length === 2) {
                const [a, b] = nodes;
                const edgeId = a < b ? `${a}-${b}` : `${b}-${a}`;
                if (!edgeSet.has(edgeId)) {
                  edgeSet.add(edgeId);
                  hyperData.edges.push({
                    id: edgeId,
                    source: a,
                    target: b,
                    ...edge,
                  });
                }
                return;
              }

              plugins.push({
                key: `bubble-sets-${key}`,
                type: HOVER_BUBBLE_SETS,
                members: nodes,
                weight: edge.weight || nodes.length,
                description: edge.description || edge.summary || "",
                edge: edge,
                ...createBubbleStyle(COLORS[i % COLORS.length]),
              });

              hyperData.hyperEdges.push({
                id: key,
                ...edge,
                members: nodes,
              });
            });

            // Assign cluster by hyperEdges for layout grouping
            // Pick the heaviest hyperedge containing the node as its primary cluster
            const nodeIdToCandidateClusters = new Map();
            hyperData.hyperEdges.forEach((he) => {
              const weight =
                he.weight ||
                (Array.isArray(he.members) ? he.members.length : 1);
              (he.members || []).forEach((m) => {
                const list = nodeIdToCandidateClusters.get(m) || [];
                list.push({ id: he.id, weight });
                nodeIdToCandidateClusters.set(m, list);
              });
            });
            hyperData.nodes = hyperData.nodes.map((n) => {
              const candidates = nodeIdToCandidateClusters.get(n.id) || [];
              if (candidates.length === 0) return n;
              const primary = candidates.reduce((best, cur) =>
                cur.weight > best.weight ? cur : best
              );
              return { ...n, cluster: primary.id };
            });
          }

          const isGraph = visualizationMode === "graph";

          return {
            data: hyperData,
            plugins: isGraph ? [] : plugins,
            node: {
              palette: { field: "cluster" },
              style: {
                size: hyperData.nodes.length > LAYOUT_THRESHOLD ? 15 : 20,
                labelText: (d) => d.id,
                fill: (d) => getNodeColor(d, selectedVertex, entityTypeColors),
                // 显式写出被状态覆盖的样式：G6 移除状态时只回到这里的值，不写就会保留状态样式
                opacity: 1,
                lineWidth: 0,
                labelFontWeight: "normal",
              },
              // 点击超边高亮：成员实体 highlight，其余 inactive
              state: {
                highlight: { stroke: "#6d28d9", lineWidth: 3, labelFontWeight: "bold" },
                inactive: { opacity: 0.15 },
              },
            },
            edge: {
              style: {
                size: isGraph ? 3 : 2,
                stroke: "#a68fff",
                lineWidth: 1,
                opacity: 1,
              },
              state: {
                highlight: { stroke: "#6d28d9", lineWidth: 3 },
                inactive: { opacity: 0.1 },
              },
            },
            layout: {
              type:
                hyperData.nodes.length > LAYOUT_THRESHOLD ? "force" : "force",
              clustering: !isGraph,
              preventOverlap: true,
              nodeClusterBy: isGraph ? undefined : "cluster",
              gravity: 50,
              linkDistance: 50,
            },
            autoFit: "center",
          };
        }, [graphData, selectedVertex, visualizationMode, entityTypeColors]);

        // Initialize graph
        useEffect(() => {
          if (!graphDataFormatted || !containerRef.current) return;

          const graph = new Graph({
            container: containerRef.current,
            width: containerRef.current.offsetWidth,
            height: containerRef.current.offsetHeight || 800,
            data: graphDataFormatted.data,
            behaviors: ["zoom-canvas", "drag-canvas", "drag-element"],
            autoFit: "center",
            animate: false,
            node: graphDataFormatted.node,
            edge: graphDataFormatted.edge,
            layout: graphDataFormatted.layout,
            plugins: graphDataFormatted.plugins,
          });

          graphRef.current = graph;
          // 实例在布局迭代中被销毁（换数据）时 render 会 reject
          graph.render().catch(() => {});

          // 点击超边：选中并高亮；再点同一条或点空白处取消
          graph.on("click", (e) => {
            if (e.targetType === "node") return;
            const next = selectionOf(e, graphDataFormatted);
            const selection =
              next && next.key !== selectedRef.current?.key ? next : null;
            selectedRef.current = selection;
            applySelection(graph, graphDataFormatted, selection);
            if (selection) setHoverHyperedge(selection.item);
          });

          graph.on("pointermove", (e) => {
            if (e.targetType === BUBBLE_SETS_TARGET && !selectedRef.current) {
              const target = e.target.options;
              const newHyperedge = {
                ...target.edge,
                members: Array.isArray(target.members) ? target.members : [],
              };
              setHoverHyperedge((prev) => {
                if (
                  !prev ||
                  prev.keywords !== newHyperedge.keywords ||
                  prev.summary !== newHyperedge.summary ||
                  prev.weight !== newHyperedge.weight ||
                  JSON.stringify(prev.members) !==
                    JSON.stringify(newHyperedge.members)
                ) {
                  return newHyperedge;
                }
                return prev;
              });
            }
            if (e.targetType === "node") {
              const target = graphDataFormatted.data.nodes.find(
                (node) => node.id === e.target.id
              );
              setHoverNode((prev) => {
                if (!prev || prev.id !== target?.id) {
                  return target;
                }
                return prev;
              });
            }

            // 侧边栏保留最后悬停的超边 / 顶点；悬停卡片只在指针位于元素上时显示
            const next = e.client ? tipOf(e, graphDataFormatted) : null;
            setTip(next ? { ...next, x: e.client.x, y: e.client.y } : null);
          });

          // Add window resize listener
          const handleResize = () => {
            if (graphRef.current && !graphRef.current.destroyed && containerRef.current) {
              graphRef.current.setSize(
                containerRef.current.offsetWidth,
                containerRef.current.offsetHeight
              );
            }
          };

          window.addEventListener("resize", handleResize);

          return () => {
            window.removeEventListener("resize", handleResize);
            // 销毁而不是 clear：clear 后力导布局仍在迭代，会更新已不存在的节点而报错
            graphRef.current = null;
            destroyGraph(graph);
            setHoverHyperedge(null);
            setTip(null);
            selectedRef.current = null;
          };
        }, [graphDataFormatted, visualizationMode]);

        // Select the "largest" node and hyperedges by default
        useEffect(() => {
          if (!graphDataFormatted) return;

          const nodes = graphDataFormatted.data.nodes;
          if (!hoverNode && nodes.length > 0) {
            const nodeWithMax = nodes.reduce((best, cur) =>
              (cur.degree || 0) > (best.degree || 0) ? cur : best
            );
            setHoverNode(nodeWithMax);
          }

          if (visualizationMode === "hyper") {
            const hyperEdges = graphDataFormatted.data.hyperEdges;
            if (!hoverHyperedge && hyperEdges.length > 0) {
              const getWeight = (edge) =>
                edge.weight || edge.members?.length || 0;
              const hyperWithMax = hyperEdges.reduce((best, cur) =>
                getWeight(cur) > getWeight(best) ? cur : best
              );

              setHoverHyperedge({
                ...hyperWithMax,
                description:
                  hyperWithMax.description || hyperWithMax.summary || "",
                members: hyperWithMax.members || [],
                weight: getWeight(hyperWithMax),
              });
            }
          }
        }, [graphDataFormatted, visualizationMode, hoverNode, hoverHyperedge]);

        return (
          <div className="flex h-screen bg-gradient-to-br from-gray-50 to-gray-100">
            <div className="w-80 h-screen overflow-hidden bg-white/95 backdrop-blur-sm border-r border-gray-200/50 p-6 shadow-xl shrink-0 flex flex-col">
              <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                Hypergraph-DB
              </h2>

              <div className="text-lg font-bold text-gray-800 mb-3 pb-2 border-b-2 border-primary-500">
                {t("databaseInfo")}
              </div>
              <div className="p-2 rounded-xl mb-6 text-sm border">
                <div className="flex justify-between items-center mb-2">
                  <span className="font-semibold text-gray-700">
                    {t("verticesLabel")}
                  </span>
                  <span className="font-bold text-primary-600">
                    {databaseInfo.vertices}
                  </span>
                </div>
                <div className="flex justify-between items-center">
                  <span className="font-semibold text-gray-700">
                    {t("hyperedgesLabel")}
                  </span>
                  <span className="font-bold text-primary-600">
                    {databaseInfo.edges}
                  </span>
                </div>
              </div>

              <div className="text-lg font-bold text-gray-800 mb-3 pb-2 border-b-2 border-primary-500">
                {t("searchList")}
              </div>

              {/* Search and Sort */}
              <div className="mb-4">
                <div className="relative mb-2">
                  <input
                    type="text"
                    placeholder={t("searchPlaceholder")}
                    value={searchTerm}
                    onChange={(e) => {
                      initialVertexRef.current = "";
                      setSearchTerm(e.target.value);
                    }}
                    className="w-full px-4 py-2 pl-10 pr-4 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200"
                  />
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg
                      className="h-4 w-4 text-gray-400"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        strokeWidth={2}
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                      />
                    </svg>
                  </div>
                  {searchTerm && (
                    <button
                      onClick={() => setSearchTerm("")}
                      className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                    >
                      <svg
                        className="h-4 w-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          strokeWidth={2}
                          d="M6 18L18 6M6 6l12 12"
                        />
                      </svg>
                    </button>
                  )}
                </div>

                {/* Sort Selection */}
                {/*<div className="flex gap-2 text-xs text-gray-600">
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="flex-1 px-2 py-1 border border-gray-300 rounded"
                  >
                    <option value="degree">By Degree</option>
                    <option value="id">By ID</option>
                  </select>
                  <select
                    value={sortOrder}
                    onChange={(e) => setSortOrder(e.target.value)}
                    className="flex-1 px-2 py-1 border border-gray-300 rounded"
                  >
                    <option value="desc">Descending</option>
                    <option value="asc">Ascending</option>
                  </select>
                </div>*/}

                <div className="mt-2 text-sm text-gray-600">
                  {t("found", { n: pagination.total })}
                </div>
              </div>

              {/* Vertices List */}
              <div className="flex-1 overflow-y-scroll hide-scrollbar border border-gray-200 rounded-xl bg-white shadow-inner">
                {loadingVertices ? (
                  <div className="p-4 text-center text-gray-500">
                    {t("loadingVertices")}
                  </div>
                ) : vertices.length === 0 ? (
                  <div className="p-4 text-center text-gray-500">
                    {t("noMatch")}
                  </div>
                ) : (
                  vertices.map((vertex) => {
                    const isSelected = selectedVertex === vertex.id;

                    return (
                      <div
                        key={vertex.id}
                        className={`p-2 border-b border-gray-100 cursor-pointer transition-all duration-200 hover:bg-gray-50 hover:shadow-sm ${
                          isSelected
                            ? "bg-primary-50 border-l-4 border-l-primary-500 shadow-md"
                            : ""
                        }`}
                        onClick={() => {
                          initialVertexRef.current = "";
                          setSelectedVertex(vertex.id);
                        }}
                      >
                        <div className="font-bold text-gray-800 mb-2 flex items-center">
                          {vertex.id}
                        </div>
                        <div className="text-sm text-gray-600 flex gap-2 items-center">
                          <div className="flex items-center">
                            <span className="font-medium">
                              {vertex.entity_type ? t("typeLabel") : t("idLabel")}
                            </span>
                            <span className="ml-2 px-2 py-1 bg-gray-100 rounded text-xs">
                              {vertex.entity_type || vertex.id}
                            </span>
                          </div>
                          <div className="flex items-center">
                            <span className="font-medium">
                              {t("degreeLabel")}
                            </span>
                            <span className="ml-2 px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs font-semibold">
                              {vertex.degree}
                            </span>
                          </div>
                        </div>
                        {vertex.description && (
                          <div className="mt-2 text-xs text-gray-500 bg-gray-50 p-2 rounded">
                            {formatDescription(vertex.description)}
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>

              {/* Pagination Controls */}
              {pagination.total_pages > 1 && (
                <div className="mt-4 flex items-center justify-between text-sm">
                  <button
                    onClick={() => handlePageChange(pagination.page - 1)}
                    disabled={pagination.page === 1}
                    className="px-3 py-1 bg-primary-500 text-white rounded disabled:bg-gray-300 disabled:cursor-not-allowed hover:bg-primary-600"
                  >
                    {t("prev")}
                  </button>
                  <span className="text-gray-600">
                    {pagination.page} / {pagination.total_pages}
                  </span>
                  <button
                    onClick={() => handlePageChange(pagination.page + 1)}
                    disabled={pagination.page === pagination.total_pages}
                    className="px-3 py-1 bg-primary-500 text-white rounded disabled:bg-gray-300 disabled:cursor-not-allowed hover:bg-primary-600"
                  >
                    {t("next")}
                  </button>
                </div>
              )}
            </div>

            <div className="flex-1 flex flex-col bg-white/10 backdrop-blur-sm">
              <div className="bg-white/95 p-4 border-b border-gray-200/50 flex justify-between items-center shadow-sm">
                <div className="flex items-center gap-4">
                  <h3 className="text-xl font-semibold text-gray-800 m-0">
                    {t(visualizationMode === "hyper" ? "titleHyper" : "titleGraph")}{" "}
                    {selectedVertex && `- ${selectedVertex}`}
                  </h3>

                  {/* Visualization Mode Selector */}
                  <div className="flex items-center gap-2">
                    <span className="text-sm text-gray-600">{t("modeLabel")}</span>
                    <div className="flex space-x-1">
                      {["hyper", "graph"].map((mode) => (
                        <button
                          key={mode}
                          onClick={() => setVisualizationMode(mode)}
                          className={`px-3 py-1 text-xs rounded-full transition-all duration-200 ${
                            visualizationMode === mode
                              ? "bg-primary-500 text-white shadow-md"
                              : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                          }`}
                        >
                          {t(mode === "hyper" ? "modeHyper" : "modeGraph")}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                {graphData && (
                  <div className="bg-white px-4 py-2 text-sm text-gray-600 rounded-lg shadow-sm border border-gray-200">
                    <span className="font-semibold">{t("verticesLabel")}</span>{" "}
                    {Object.keys(graphData.vertices).length} |
                    <span className="font-semibold ml-1">
                      {t(visualizationMode === "hyper" ? "hyperedgesLabel" : "edgesLabel")}
                    </span>{" "}
                    {visualizationMode === "hyper"
                      ? Object.keys(graphData.edges).length
                      : graphDataFormatted?.data?.edges?.length || 0}
                  </div>
                )}
                  <div
                    className="flex rounded-lg border border-gray-200 overflow-hidden text-xs"
                    role="group"
                    aria-label="Language"
                  >
                    {[["en", "EN"], ["zh", "中文"]].map(([code, name]) => (
                      <button
                        key={code}
                        onClick={() => setLang(code)}
                        className={`px-2.5 py-1 ${
                          lang === code
                            ? "bg-primary-500 text-white"
                            : "bg-white text-gray-600 hover:bg-gray-50"
                        }`}
                      >
                        {name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex-1 relative bg-white">
                {error && (
                  <div className="bg-red-50 text-red-700 p-4 m-4 rounded-lg border-l-4 border-red-500 shadow-sm">
                    <div className="flex items-center">
                      <span className="text-xl mr-2">⚠️</span>
                      <span className="font-medium">{t(error)}</span>
                    </div>
                  </div>
                )}

                {loading && (
                  <div className="absolute inset-0 flex justify-center items-center bg-white/80 backdrop-blur-sm z-50 text-lg text-gray-600">
                    <div className="text-center">
                      <div className="text-2xl mb-4">🔄</div>
                      <div className="font-semibold">
                        {t("loadingGraph")}
                      </div>
                      <div className="text-sm mt-2 text-gray-500">
                        {t("loadingHint")}
                      </div>
                    </div>
                  </div>
                )}

                <div className="flex h-[calc(100vh-71px)]">
                  <div
                    ref={containerRef}
                    className="w-full rounded-xl h-full"
                    onMouseLeave={() => setTip(null)}
                  />
                  {tip && (
                    <HoverTip
                      title={tip.title}
                      item={tip.item}
                      priority={tip.priority}
                      exclude={tip.exclude}
                      limit={tip.limit}
                      x={tip.x}
                      y={tip.y}
                    />
                  )}
                  {visualizationMode === "hyper" && (
                    <div className="shrink-0 w-72 h-full overflow-y-auto bg-white/95 backdrop-blur-sm border-l border-gray-200/50 p-3 shadow-xl overflow-y-auto">
                      <div className="text-lg font-bold text-gray-800 mb-3 pb-2 border-b-2 border-primary-500">
                        {t("detail")}
                      </div>
                      {hoverHyperedge && (
                        <div className="text-sm text-gray-700 space-y-3 border-b-2 border-primary-500 pb-6">
                          <div className="text-base font-semibold text-gray-900">
                            {t(
                              hoverHyperedge.members?.length === 2
                                ? "edge"
                                : "hyperedge"
                            )}
                          </div>
                          <PropertyList item={hoverHyperedge} />
                        </div>
                      )}
                      {hoverNode && (
                        <div className="text-sm text-gray-700 space-y-3 mt-4">
                          <div className="text-base font-semibold text-gray-900">
                            {t("node")}
                          </div>
                          <PropertyList item={hoverNode} />
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<HypergraphViewer />, document.getElementById("root"));
    </script>
  </body>
</html>
