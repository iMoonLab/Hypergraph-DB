<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypergraph DB Admin</title>
    <script src="https://unpkg.com/@antv/g6@5.0.49/dist/g6.min.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- 管理后台（概览、实体与超边的增删改查、导入 / 导出），与 Hyper-RAG web-ui 共用 hypergraph-viz -->
    <script src="https://unpkg.com/hypergraph-viz@0.2.0/dist/hypergraph-viz.explorer.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/hypergraph-viz@0.2.0/dist/style.css" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      const { mountAdmin, createHttpAdminApi, fromKeyedEdges } = window.HypergraphViz;

      mountAdmin(document.getElementById("root"), {
        api: {
          ...createHttpAdminApi("/api/admin"),
          // 实体详情中的关系图：查看器服务的 /api/graph（超边 key 为用 |#| 拼接的成员）
          subgraph: async (id) => {
            const res = await fetch(`/api/graph?${new URLSearchParams({ vertex_id: id })}`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            return fromKeyedEdges(data);
          },
        },
        viewerUrl: "/viewer",
        hashRouting: true,
        // 语言与查看器共用同一个 localStorage 键
        localeStorageKey: "hgdb-admin-lang",
      });
    </script>
  </body>
</html>
